# Landing for educacionabordo.com: the Next.js static export in ./out served by Workers Static Assets.
# The custom_domain routes make Cloudflare create the DNS records and certificates, so nothing is added by hand in the DNS UI.
name = "educacionabordo-landing"
compatibility_date = "2026-08-01"

# Top-level keys must stay above [assets]: anything after a table header belongs to that table, and wrangler silently ignores assets.routes.
routes = [
  { pattern = "educacionabordo.com", custom_domain = true },
  { pattern = "www.educacionabordo.com", custom_domain = true },
]

[assets]
directory = "./out"
# Next's static export ships a 404.html; serve it with a real 404 instead of falling back to the home page.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
